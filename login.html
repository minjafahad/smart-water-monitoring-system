<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Water | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme" style="position:absolute; top:24px; right:24px; z-index:100; background:rgba(0,0,0,0.2); border:1px solid var(--border-color); color:var(--text-primary); border-radius:12px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer;">
            <i id="theme-icon" data-feather="moon"></i>
        </button>
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>

        <div class="auth-card glass-panel">
            <div class="auth-header">
                <i data-feather="droplet"></i>
                <h1>AquaSense</h1>
                <p>Smart Water Services Monitoring System</p>
            </div>

            <form id="loginForm">
                <div id="errorMessage"
                    style="display:none; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fecaca; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; text-align: left;">
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="admin" required
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required
                        autocomplete="current-password">
                </div>

                <div style="display: flex; justify-content: space-between; margin-bottom: 24px; font-size: 0.85rem;">
                    <label
                        style="display: flex; align-items: center; gap: 8px; color: var(--text-secondary); cursor: pointer;">
                        <input type="checkbox" style="accent-color: var(--primary-color);"> Remember me
                    </label>
                    <a href="register.html" style="color: var(--primary-color); text-decoration: none;">Create
                        Account</a>
                </div>

                <button type="submit" class="btn">Sign In</button>
            </form>

            <div style="margin-top: 24px; font-size: 0.85rem; color: var(--text-secondary);">
                Rural Water Management Panel
            </div>
        </div>
    </div>

    <script>
        feather.replace();

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn = this.querySelector('button');
            const originalText = btn.innerText;
            btn.innerHTML = '<i data-feather="loader" class="spin"></i> Authenticating...';
            feather.replace();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errBox = document.getElementById('errorMessage');
            errBox.style.display = 'none';

            try {
                const res = await fetch('api/auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.status === 'success') {
                    window.location.href = 'index.html';
                } else {
                    errBox.style.display = 'block';
                    errBox.innerText = data.message || 'Login failed';
                    btn.innerText = originalText;
                }
            } catch (err) {
                errBox.style.display = 'block';
                errBox.innerText = 'Network error. Make sure PHP server is running.';
                btn.innerText = originalText;
            }
        });
    </script>
    <style>
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .spin {
            animation: spin 1s linear infinite;
        }
    </style>
</body>

</html>
